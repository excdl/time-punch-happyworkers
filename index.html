<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能打卡系統</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
body {font-family:"Arial","Noto Sans TC",sans-serif;background:#f0f4f8;display:flex;justify-content:center;padding:20px;margin:0;}
.card {background:#fff;width:95%;max-width:480px;border-radius:20px;padding:25px 20px;display:flex;flex-direction:column;align-items:center;gap:20px;box-shadow:0 15px 30px rgba(0,0,0,0.15);}
#userInfo {font-size:28px;font-weight:bold;text-align:center;color:#2c3e50;}
#dateTime {font-size:22px;color:#7f8c8d;text-align:center;}
#statusInfo {font-size:20px;color:white;padding:8px 25px;border-radius:25px;text-align:center;min-width:180px;}
.buttons-container {display:flex;gap:15px;width:100%;}
.buttons-container button {flex:1;padding:15px 0;font-size:22px;font-weight:bold;border-radius:12px;border:none;cursor:pointer;color:white;transition:all 0.2s;}
#btnStart {background: linear-gradient(135deg, #3498db, #2980b9);}
#btnEnd {background: linear-gradient(135deg, #2ecc71, #27ae60);}
button:disabled {opacity:0.5;cursor:not-allowed;}
#todayRecords {width:100%;background:#fafafa;border-radius:14px;padding:15px;border:1px solid #ddd;font-size:18px;text-align:left;}
#todayRecords span {display:block;margin-bottom:5px;padding-left:5px;border-left:3px solid #3498db;}
/* 主管審批按鈕 */
#btnApprove {
    margin-top:10px;
    padding:12px 20px;
    font-size:18px;
    font-weight:bold;
    border-radius:10px;
    background:linear-gradient(145deg,#8e44ad,#663399);
    color:white;
    display:none;
    width:100%;
    cursor:pointer;
    border:none;
}
#btnApprove:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

</style>
</head>
<body>
<div class="card">
  <div id="userInfo">載入使用者資訊中...</div>
  <div id="statusInfo">定位確認中…</div>
  <div id="dateTime">載入中…</div>
  <div class="buttons-container">
    <button id="btnStart" disabled>上班</button>
    <button id="btnEnd" disabled>下班</button>
  </div>
  <div id="todayRecords">今日打卡紀錄（點擊更新）</div>
  <button id="btnApprove">查看 | 簽核</button>
</div>
 
<script>
const API_ENDPOINT =
  "https://script.google.com/macros/s/AKfycbxxjbWOYzokHi8VjUHHyLANLko1k5vpNNUsRmpT6yImzNPIhgE7VQrKQ4w7gdstqwLa8A/exec";

/* ===== 打卡中心點（請修改） ===== */
const OFFICE_LAT = 25.128250;
const OFFICE_LNG = 121.741900;
const ALLOW_DISTANCE = 200; // 公尺

/* ===== 全域 ===== */
let userId = "";
let userName = "";
let dataReady = false;

let MANAGERS = [];
let isManager = false;

let lastGPS = null;
let gpsAccuracy = null;
let cachedIP = "";

let lastRangeStatus = null;
let lastCheckTime = 0;

const btnStart = document.getElementById("btnStart");
const btnEnd = document.getElementById("btnEnd");

const userInfo = document.getElementById("userInfo");
const statusInfo = document.getElementById("statusInfo");
const dateTime = document.getElementById("dateTime");
const todayRecords = document.getElementById("todayRecords");

/* =========================================
   日期時間
========================================= */

function updateDateTime() {
  dateTime.textContent = new Date().toLocaleString("zh-TW", {
    hour12: false
  });
}

setInterval(updateDateTime, 1000);
updateDateTime();

function getTodayString() {
  const d = new Date();

  return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(
    2,
    "0"
  )}/${String(d.getDate()).padStart(2, "0")}`;
}

/* =========================================
   UI
========================================= */

function setButtonsLock(lock) {
  btnStart.disabled = lock;
  btnEnd.disabled = lock;
}

function setStatus(text, color) {
  statusInfo.textContent = text;
  statusInfo.style.background = color;
}

/* =========================================
   GAS 預熱（非常重要）
========================================= */

function warmupAPI() {
  fetch(API_ENDPOINT + "?ping=1").catch(() => {});
}

/* =========================================
   IP（背景載入）
========================================= */

async function preloadIP() {
  try {
    const res = await fetch("https://api.ipify.org?format=json");

    const data = await res.json();

    cachedIP = data.ip;
  } catch (e) {}
}

function getIP() {
  return cachedIP || "";
}

/* =========================================
   距離計算（前端直接算）
========================================= */

function getDistanceMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;

  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLng = ((lng2 - lng1) * Math.PI) / 180;

  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos((lat1 * Math.PI) / 180) *
      Math.cos((lat2 * Math.PI) / 180) *
      Math.sin(dLng / 2) *
      Math.sin(dLng / 2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

  return Math.round(R * c);
}

/* =========================================
   GPS
========================================= */

/* 快速取得（2秒內） */
async function getQuickLocation() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) {
      resolve(false);
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        lastGPS = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude
        };

        gpsAccuracy = pos.coords.accuracy;

        resolve(true);
      },
      () => resolve(false),
      {
        enableHighAccuracy: false,
        timeout: 2000,
        maximumAge: 60000
      }
    );
  });
}

/* 背景高精度追蹤 */
function initGPSWatcher() {
  if (!navigator.geolocation) return;

  navigator.geolocation.watchPosition(
    (pos) => {
      lastGPS = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude
      };

      gpsAccuracy = pos.coords.accuracy;

      updateStatus();
    },
    (err) => {
      console.warn("GPS失敗", err);
    },
    {
      enableHighAccuracy: true,
      timeout: 8000,
      maximumAge: 3000
    }
  );
}

/* =========================================
   主管
========================================= */

async function loadManagers() {
  try {
    const res = await fetch(`${API_ENDPOINT}?action=getManagers`);

    MANAGERS = await res.json();
  } catch (e) {
    MANAGERS = [];
  }
}

/* =========================================
   LIFF
========================================= */

async function initUser() {
  await liff.init({
    liffId: "2008504718-nmXP0WRV"
  });

  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }

  const profile = await liff.getProfile();

  userId = profile.userId;
  userName = profile.displayName;

  userInfo.textContent = `${userName} 您好`;

  await loadManagers();

  isManager = MANAGERS.includes(userId);

  if (isManager) {
    document.getElementById("btnApprove").style.display = "block";
  }
}

/* =========================================
   狀態（前端秒判斷）
========================================= */

async function updateStatus() {
  if (!lastGPS) {
    setStatus("定位中…", "#95a5a6");
    return;
  }

  const now = Date.now();

  /* 防止狂刷 */
  if (now - lastCheckTime < 3000) return;

  lastCheckTime = now;

  const distance = getDistanceMeters(
    lastGPS.lat,
    lastGPS.lng,
    OFFICE_LAT,
    OFFICE_LNG
  );

  const inRange = distance <= ALLOW_DISTANCE;

  const newStatus = inRange ? "有效打卡區" : "無效打卡區";

  if (newStatus === lastRangeStatus) return;

  lastRangeStatus = newStatus;

  if (inRange) {
    setStatus(`有效打卡區 (${distance}m)`, "#2ecc71");

    btnStart.disabled = false;
    btnEnd.disabled = false;
  } else {
    setStatus(`無效打卡區 (${distance}m)`, "#e74c3c");

    if (isManager) {
      btnStart.disabled = false;
      btnEnd.disabled = false;
    } else {
      btnStart.disabled = true;
      btnEnd.disabled = true;
    }
  }
}

/* =========================================
   今日紀錄
========================================= */

async function updateTodayRecords() {
  if (!userId) return;

  todayRecords.innerHTML = "載入中...";

  try {
    const res = await fetch(
      `${API_ENDPOINT}?action=getToday&userId=${userId}&date=${getTodayString()}`
    );

    const data = await res.json();

    if (!data.length) {
      todayRecords.innerHTML = "今日打卡紀錄：無";
      return;
    }

    todayRecords.innerHTML = "今日打卡紀錄：<br>";

    data.forEach((r) => {
      let color = "#3498db";

      if (r.status === "下班") color = "#2ecc71";

      if (r.company.includes("錯誤")) color = "#e67e22";

      todayRecords.innerHTML += `
        <span style="
          display:block;
          margin:8px 0;
          padding-left:10px;
          border-left:5px solid ${color};
        ">
          ${r.status}：${r.time}（${r.company}）
        </span>
      `;
    });
  } catch (e) {
    todayRecords.innerHTML = "今日打卡紀錄：讀取失敗";
  }
}

/* =========================================
   LINE FLEX
========================================= */

async function sendSelfMessage(record) {
  if (!liff.isInClient()) return;

  let headerColor = "#3498db";

  if (record.status === "下班") {
    headerColor = "#2ecc71";
  }

  if (record.rangeStatus !== "有效打卡區") {
    headerColor = "#e67e22";
  }

  try {
    await liff.sendMessages([
      {
        type: "flex",
        altText: "打卡通知",
        contents: {
          type: "bubble",

          header: {
            type: "box",
            layout: "vertical",

            contents: [
              {
                type: "text",
                text: `${record.userName} 已打卡`,
                weight: "bold",
                size: "lg",
                color: "#ffffff"
              }
            ],

            backgroundColor: headerColor,
            paddingAll: "12px"
          },

          body: {
            type: "box",
            layout: "vertical",
            spacing: "md",

            contents: [
              {
                type: "text",
                text: `狀態：${record.status}`
              },

              {
                type: "text",
                text: `時間：${record.date} ${record.time}`
              },

              {
                type: "text",
                text: `位置：${record.company}`
              }
            ]
          }
        }
      }
    ]);
  } catch (e) {
    console.error(e);
  }
}

/* =========================================
   打卡
========================================= */

async function clockInOut(status) {
  if (!dataReady) {
    Swal.fire({
      icon: "info",
      title: "系統初始化中",
      timer: 1500,
      showConfirmButton: false
    });

    return;
  }

  if (!lastGPS) {
    Swal.fire({
      icon: "warning",
      title: "定位尚未完成",
      timer: 1500,
      showConfirmButton: false
    });

    return;
  }

  if (lastRangeStatus !== "有效打卡區" && !isManager) {
    Swal.fire({
      icon: "warning",
      title: "目前不在打卡範圍",
      timer: 1500,
      showConfirmButton: false
    });

    return;
  }

  const btn = status === "上班" ? btnStart : btnEnd;

  btn.disabled = true;

  const originalText = btn.textContent;

  let sec = 3;

  const timer = setInterval(() => {
    btn.textContent = `打卡中 ${sec}s`;

    sec--;

    if (sec < 0) {
      clearInterval(timer);
    }
  }, 1000);

  try {
    const res = await fetch(API_ENDPOINT, {
      method: "POST",

      body: JSON.stringify({
        userId,
        userName,
        status,
        ip: getIP(),
        gps: lastGPS,
        accuracy: gpsAccuracy,
        rangeStatus: lastRangeStatus
      })
    });

    const data = await res.json();

    Swal.fire({
      icon:
        data.rangeStatus === "有效打卡區"
          ? "success"
          : "warning",

      title:
        data.rangeStatus === "有效打卡區"
          ? "打卡成功"
          : "異常打卡",

      timer: 2000,
      showConfirmButton: false
    });

    const record = {
      userName,
      status: data.status,
      date: data.date,
      time: data.time,
      company: data.company,
      rangeStatus: data.rangeStatus
    };

    /* 不阻塞 UI */
    sendSelfMessage(record).catch(console.error);

    updateTodayRecords();

  } catch (e) {
    Swal.fire({
      icon: "error",
      title: "打卡失敗",
      timer: 2000,
      showConfirmButton: false
    });
  } finally {
    clearInterval(timer);

    btn.textContent = originalText;

    btn.disabled = false;
  }
}

/* =========================================
   事件
========================================= */

btnStart.onclick = () => clockInOut("上班");

btnEnd.onclick = () => clockInOut("下班");

document.getElementById("btnApprove").onclick = () => {
  window.location.href =
    "https://script.google.com/macros/s/AKfycbxEi8cYyiEBHBgRyA4I4eQT2WKDs5AHR8vq_qQf5nFYno34DYwxhNNUOxt8E37WFptHVQ/exec";
};

/* =========================================
   啟動（超重要）
========================================= */

document.addEventListener("DOMContentLoaded", async () => {

  setStatus("初始化中…", "#95a5a6");

  setButtonsLock(true);

  /* 先預熱 GAS */
  warmupAPI();

  /* 背景 GPS */
  initGPSWatcher();

  /* 平行初始化 */
  await Promise.all([
    initUser(),
    preloadIP(),
    getQuickLocation()
  ]);

  /* UI 立即可用 */
  dataReady = true;

  setButtonsLock(false);

  updateStatus();

  updateTodayRecords();

});
